name: CF Official IP SpeedTest

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cfst:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: 拉 Cloudflare 官方 IPv4 段
        run: |
          curl -sL https://www.cloudflare.com/ips-v4 -o ips.txt
          wc -l ips.txt

      - name: 下载 CloudflareST linux amd64
        run: |
          VER=$(curl -s https://api.github.com/repos/XIU2/CloudflareSpeedTest/releases/latest | grep '"tag_name"' | head -1 | cut -d'"' -f4)
          echo "最新版本: $VER"
          curl -L --retry 3 --retry-delay 5 "https://github.com/XIU2/CloudflareSpeedTest/releases/download/${VER}/CloudflareST_linux_amd64.tar.gz" -o cfst.tar.gz
          file cfst.tar.gz
          tar -xzf cfst.tar.gz
          chmod +x CloudflareST
          ./CloudflareST -v

      - name: 测速（官方段抽样，只测延迟）
        run: |
          ./CloudflareST -f ips.txt -dd -tl 200 -tll 40 -t 4 -p 50 -o result.csv
          tail -n +2 result.csv | cut -d',' -f1 | head -20 > best_ips.txt
          tail -n +2 result.csv | awk -F',' '$4=="0.00" && $5<=200 {print $1}' > full_ips.txt
          echo "--- best_ips.txt ---"
          cat best_ips.txt

      - name: 提交回仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATE=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M CST')
          git add ips.txt best_ips.txt full_ips.txt result.csv
          git commit -m "优选更新 $DATE" || echo "无变化跳过"
          git push
