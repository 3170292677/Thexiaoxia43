name: CF Official IP SpeedTest

on:
  schedule:
    - cron: '0 */6 * * *'          # 每6小时 UTC 跑一次
  workflow_dispatch:              # 网页上可手动 Run workflow

permissions:
  contents: write                 # GITHUB_TOKEN 推回当前仓库所需

jobs:
  cfst:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: 拉 Cloudflare 官方 IPv4 段（纯官方15段CIDR）
        run: |
          curl -sL https://www.cloudflare.com/ips-v4 -o ips.txt
          wc -l ips.txt

      - name: 下载 CloudflareST linux amd64
        run: |
          VER=$(curl -s https://api.github.com/repos/XIU2/CloudflareSpeedTest/releases/latest | grep -oP '"tag_name": "\K[^"]+')
          curl -sL "https://github.com/XIU2/CloudflareSpeedTest/releases/download/${VER}/CloudflareST_linux_amd64.tar.gz" -o cfst.tar.gz
          tar -xzf cfst.tar.gz
          chmod +x CloudflareST

      - name: 测速（官方段抽样，只测延迟）
        run: |
          ./CloudflareST -f ips.txt -dd -tl 200 -tll 40 -t 4 -p 50 -o result.csv
          tail -n +2 result.csv | cut -d',' -f1 | head -20 > best_ips.txt
          tail -n +2 result.csv | awk -F',' '$4=="0.00" && $5<=200 {print $1}' > full_ips.txt
          echo "--- best_ips.txt ---"
          cat best_ips.txt

      - name: 提交回仓库（用 GITHUB_TOKEN，不碰你的 PAT）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATE=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M CST')
          git add ips.txt best_ips.txt full_ips.txt result.csv
          git commit -m "优选更新 $DATE" || echo "无变化跳过"
          git push
