name: Split Cloudflare Official IPs

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and generate IPs (limit 10000)
        run: |
          curl -sL https://www.cloudflare.com/ips-v4 -o ips-v4.txt
          python3 << 'PYEOF'
          import ipaddress

          LIMIT = 10000
          ips = []
          with open("ips-v4.txt") as f:
              for line in f:
                  line = line.strip()
                  if not line:
                      continue
                  net = ipaddress.ip_network(line, strict=False)
                  for ip in net.hosts():
                      ips.append(str(ip))
                      if len(ips) >= LIMIT:
                          break
                  if len(ips) >= LIMIT:
                      break

          with open("cf_official_ips.txt", "w") as f:
              f.write("\n".join(ips) + "\n")

          print(f"Total: {len(ips)}")
          PYEOF
          wc -l cf_official_ips.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cf_official_ips.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push
          fi
