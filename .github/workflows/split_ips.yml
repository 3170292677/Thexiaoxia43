name: Split Cloudflare Official IPs

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download and expand all IPs
        run: |
          curl -sL https://www.cloudflare.com/ips-v4 -o ips-v4.txt
          python3 -c '
          import ipaddress
          ips=[]
          with open("ips-v4.txt") as f:
              for line in f:
                  line=line.strip()
                  if not line: continue
                  net=ipaddress.ip_network(line,strict=False)
                  ips.extend([str(ip) for ip in net.hosts()])
          with open("cf_official_ips.txt","w") as f:
              f.write("\n".join(ips))
          print(len(ips))
          '

      - name: Limit to 7000 lines
        run: |
          head -7000 cf_official_ips.txt > cf_official_ips.txt.tmp
          mv cf_official_ips.txt.tmp cf_official_ips.txt
          wc -l cf_official_ips.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cf_official_ips.txt
          git diff --cached --quiet || git commit -m "Update $(TZ=Asia/Shanghai date '+%Y-%m-%d')"
          git push
