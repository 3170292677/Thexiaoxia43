name: Split Cloudflare Official IPs

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Download Cloudflare official IPv4 ranges
        run: |
          curl -sL https://www.cloudflare.com/ips-v4 -o ips-v4.txt
          echo "Raw CIDR count:"
          wc -l ips-v4.txt

      - name: Expand to /24 representatives (~7000 IPs)
        run: |
          python3 -c '
          import ipaddress

          with open("ips-v4.txt") as f:
              cidrs = [line.strip() for line in f if line.strip()]

          seen_24 = set()
          ips = []

          for cidr in cidrs:
              try:
                  network = ipaddress.ip_network(cidr, strict=False)
                  # 如果段 >= /24，取该段第一个 IP 作为 /24 代表
                  # 如果段 < /24（如 /20），拆成多个 /24 各取第一个
                  if network.prefixlen <= 24:
                      # 大段拆成 /24
                      for subnet in network.subnets(new_prefix=24):
                          key = str(subnet.network_address)
                          if key not in seen_24:
                              seen_24.add(key)
                              ips.append(str(subnet.network_address))
                  else:
                      # 小段（如 /28）直接取第一个
                      first = str(next(network.hosts()))
                      key = ".".join(first.split(".")[:3]) + ".0"
                      if key not in seen_24:
                          seen_24.add(key)
                          ips.append(first)
              except Exception as e:
                  print(f"Skip {cidr}: {e}")

          with open("cf_official_ips.txt", "w") as f:
              f.write("\n".join(ips))

          print(f"Total /24 representative IPs: {len(ips)}")
          '

      - name: Show sample
        run: |
          echo "First 10 lines:"
          head -10 cf_official_ips.txt
          echo "..."
          echo "Total lines:"
          wc -l cf_official_ips.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cf_official_ips.txt
          git diff --cached --quiet || git commit -m "Update cf_official_ips.txt $(TZ=Asia/Shanghai date '+%Y-%m-%d')"
          git push
