name: Split Cloudflare Official IPs

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and expand (limit 7000)
        run: |
          curl -sL https://www.cloudflare.com/ips-v4 -o ips-v4.txt
          python3 -c 'import ipaddress; ips=[]; [ips.extend([str(ip) for ip in ipaddress.ip_network(l.strip(), strict=False).hosts()]) for l in open("ips-v4.txt") if l.strip()]; open("cf_official_ips.txt","w").write("\n".join(ips[:7000]))'
          wc -l cf_official_ips.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cf_official_ips.txt
          git diff --cached --quiet || git commit -m "Update $(TZ=Asia/Shanghai date '+%Y-%m-%d')"
          git pull --rebase origin main
          git push
