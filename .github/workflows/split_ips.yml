name: Split Cloudflare Official IPs

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Download Cloudflare official IPv4 ranges
        run: |
          curl -sL https://www.cloudflare.com/ips-v4 -o ips-v4.txt
          echo "Raw CIDR lines:"
          cat ips-v4.txt

      - name: Expand CIDR to individual IPs
        run: |
          python3 -c '
          import ipaddress

          with open("ips-v4.txt") as f:
              cidrs = [line.strip() for line in f if line.strip()]

          ips = []
          for cidr in cidrs:
              try:
                  network = ipaddress.ip_network(cidr, strict=False)
                  for ip in network.hosts():
                      ips.append(str(ip))
              except Exception as e:
                  print(f"Skip {cidr}: {e}")

          with open("cf_official_ips.txt", "w") as f:
              f.write("\n".join(ips))

          print(f"Total IPs: {len(ips)}")
          '

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cf_official_ips.txt
          git diff --cached --quiet || git commit -m "Update cf_official_ips.txt $(TZ=Asia/Shanghai date '+%Y-%m-%d')"
          git push
