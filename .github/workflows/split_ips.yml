name: Split Cloudflare Official IPs

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and expand to IP:port#region
        run: |
          curl -sL https://www.cloudflare.com/ips-v4 -o ips-v4.txt
          python3 << 'PYEOF'
          import ipaddress, itertools
          from collections import defaultdict

          LIMIT = 20000
          REGION_MAP = {
              "173.245.48.0/20":  "US",
              "103.21.244.0/22":  "HK",
              "103.22.200.0/22":  "HK",
              "103.31.4.0/22":    "HK",
              "141.101.64.0/18":  "SG",
              "108.162.192.0/18": "US",
              "190.93.240.0/20":  "BR",
              "188.114.96.0/20":  "DE",
              "197.234.240.0/22": "ZA",
              "198.41.128.0/17":  "US",
              "162.158.0.0/15":   "US",
              "104.16.0.0/13":    "US",
              "104.24.0.0/14":    "US",
              "172.64.0.0/13":    "US",
              "131.0.72.0/22":    "AU",
          }

          per_cidr = defaultdict(list)
          order = []
          with open("ips-v4.txt") as f:
              for line in f:
                  cidr = line.strip()
                  if not cidr:
                      continue
                  if cidr not in REGION_MAP:
                      continue
                  order.append(cidr)
                  net = ipaddress.ip_network(cidr, strict=False)
                  region = REGION_MAP[cidr]
                  for ip in net.hosts():
                      per_cidr[cidr].append(f"{ip}:443#{region}")

          lists = [per_cidr[c] for c in order if per_cidr[c]]
          ips = []
          for tup in itertools.zip_longest(*lists):
              for item in tup:
                  if item is None:
                      continue
                  ips.append(item)
                  if len(ips) >= LIMIT:
                      break
              if len(ips) >= LIMIT:
                  break

          with open("cf_official_ips.txt", "w") as f:
              f.write("\n".join(ips) + "\n")

          print(f"Total: {len(ips)}")
          regions = {}
          for x in ips:
              r = x.split("#")[1]
              regions[r] = regions.get(r, 0) + 1
          for r, c in sorted(regions.items(), key=lambda x: -x[1]):
              print(f"  {r}: {c}")
          PYEOF

      - name: Verify format
        run: |
          echo "--- File size ---"
          du -h cf_official_ips.txt
          echo "--- Line count ---"
          wc -l cf_official_ips.txt
          echo "--- First 8 lines ---"
          head -8 cf_official_ips.txt
          echo "--- Last 3 lines ---"
          tail -3 cf_official_ips.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cf_official_ips.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push
          fi
